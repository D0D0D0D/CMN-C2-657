[project]
name = "cmn-c2-657"
version = "1.0.0"
description = "CandidateFitAndPerformancePotentialReportAgent — AgentCore Template"
requires-python = ">=3.11"
# The framework (agenticstar-agentcore) is NOT a public-PyPI dependency; it is
# installed from the platform's own package registry at build time. Pinning it
# here would make `pip install -e .` fail, because it is not resolvable from
# the default index.
dependencies = [
    "agenticstar-agentcore[marketplace,openai]==1.0.3",]

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
    "pytest-cov==5.0.0",
    "pytest-asyncio==1.4.0",
    "ruff==0.4.4",
    "mypy==1.10.0",
    # PB-7's conditional gate reads config/config.yaml to decide whether HITL is
    # enabled. Without pyyaml the read fails and the gate would silently treat
    # this HITL template as non-HITL, skipping PB-7 entirely (a false green).
    # Pin it explicitly rather than relying on a transitive dependency.
    "pyyaml==6.0.1",
]

[build-system]
requires = ["setuptools==68.2.2"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
